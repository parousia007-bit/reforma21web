<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo | Reforma 2.1</title>
    <meta name="description" content="Análisis desde una visión reformacional · Reforma 2.1">
    <meta name="theme-color" content="#0D1020">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Reforma 2.1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230D1020'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23E2B04F'%3E✦%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="ambient" aria-hidden="true"></div>
    <div class="read-progress" aria-hidden="true"><span id="read-progress"></span></div>

    <nav class="subnav" aria-label="Navegación del artículo">
        <div class="nav-inner">
            <a href="../index.html#muro" class="subnav-back"><i data-lucide="arrow-left"></i> Volver a los artículos</a>
            <a href="../index.html" class="nav-logo"><span class="mark">✦</span> Reforma <span>2.1</span></a>
        </div>
    </nav>

    <main class="article-shell">
        <header class="article-header">
            <div class="article-tags" id="article-tags"></div>
            <h1 class="article-title" id="article-title">Cargando…</h1>
            <p class="article-lead" id="article-lead" hidden></p>
            <div class="article-meta">
                <span id="article-author"></span>
                <span id="article-date"></span>
                <span id="article-time"></span>
            </div>
        </header>

        <figure class="article-cover" id="article-cover" hidden>
            <img id="header-img" alt="">
        </figure>

        <div class="article-body">
            <div id="article-content">
                <div class="article-loading">
                    <div class="sk-line"></div><div class="sk-line"></div><div class="sk-line" style="width:70%"></div>
                </div>
            </div>
        </div>

        <div class="article-end" id="article-end" hidden>
            <a href="../index.html#muro" class="btn btn-outline btn-sm"><i data-lucide="library"></i> Más artículos</a>
            <div class="share-row">
                <a class="share-btn" id="share-wa" target="_blank" rel="noopener noreferrer" aria-label="Compartir por WhatsApp"><i data-lucide="message-circle"></i></a>
                <button class="share-btn" id="share-copy" type="button" aria-label="Copiar enlace"><i data-lucide="link"></i></button>
                <button class="share-btn" id="share-native" type="button" aria-label="Compartir" hidden><i data-lucide="share-2"></i></button>
            </div>
        </div>
    </main>

    <script src="../js/db/db_articulos.js?v=1.2"></script>
    <script src="../js/db/articulos.js?v=1.2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
    <script src="../js/ui.js"></script>
    <script>
        const renderIcons = Reforma.icons;
        const clean = (s) => DOMPurify.sanitize(String(s ?? ''), { ALLOWED_TAGS: [] });
        const safeColor = (v) => /^#[0-9a-f]{3,8}$/i.test(String(v || '').trim()) ? String(v).trim() : 'var(--gold)';

        // Decodifica entidades HTML escapadas (ej: &lt;p&gt; → <p>)
        function decodeHTMLEntities(text) {
            const textArea = document.createElement('textarea');
            textArea.innerHTML = text;
            return textArea.value;
        }

        // Los artículos antiguos traen títulos con font-family/color en línea.
        // Los neutralizamos para que manden los estilos editoriales del sitio.
        function normalizeLegacyStyles(root) {
            root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => h.removeAttribute('style'));
            root.querySelectorAll('[style]').forEach(el => {
                el.style.removeProperty('font-family');
                el.style.removeProperty('text-align');
                if (!el.getAttribute('style').trim()) el.removeAttribute('style');
            });
        }

        function embedUrlFor(rawVideoUrl) {
            const yt = rawVideoUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
            if (yt) return `https://www.youtube-nocookie.com/embed/${yt[1]}`;
            if (/facebook\.com\/.*\/videos\/\d+/.test(rawVideoUrl)) {
                return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(rawVideoUrl)}&width=640`;
            }
            return null; // No incrustamos dominios desconocidos
        }

        function setupShare(title) {
            const url = window.location.href;
            document.getElementById('share-wa').href = 'https://wa.me/?text=' + encodeURIComponent(title + ' — ' + url);
            const copyBtn = document.getElementById('share-copy');
            copyBtn.addEventListener('click', async () => {
                try { await navigator.clipboard.writeText(url); Reforma.toast('Enlace copiado', 'link'); } catch (_) {}
            });
            if (navigator.share) {
                const nativeBtn = document.getElementById('share-native');
                nativeBtn.hidden = false;
                nativeBtn.addEventListener('click', () => navigator.share({ title, url }).catch(() => {}));
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            renderIcons();
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const contentEl = document.getElementById('article-content');

            const showError = (msg) => {
                document.getElementById('article-title').textContent = 'Artículo no disponible';
                contentEl.innerHTML = `<div class="article-error"><h2>No encontramos este artículo</h2><p>${msg}</p><a class="btn btn-gold" href="../index.html#muro">Ver todos los artículos</a></div>`;
            };

            if (!id) return showError('El enlace no incluye el identificador del artículo.');

            let article = null;
            try {
                const response = await fetch('/api/articles/' + encodeURIComponent(id));
                if (!response.ok) throw new Error('HTTP ' + response.status);
                article = await response.json();
            } catch (error) {
                console.warn('API no disponible, usando base local.', error);
                if (typeof articulosDB !== 'undefined' && articulosDB[id]) article = articulosDB[id];
                else if (typeof contenidosDB !== 'undefined' && contenidosDB[id]) article = contenidosDB[id];
            }

            if (!article) return showError(`Puede que se haya movido o que el enlace esté incompleto (<code>${clean(id)}</code>).`);

            // ── CABECERA ────────────────────────────────────────────────
            const titulo = clean(article.titulo || 'Artículo');
            document.title = titulo + ' | Reforma 2.1';
            document.getElementById('article-title').textContent = decodeHTMLEntities(titulo);

            const tags = Array.isArray(article.etiquetas) ? article.etiquetas : (article.categoria ? [article.categoria] : []);
            const accent = safeColor(article.color_tema);
            document.getElementById('article-tags').innerHTML = tags.filter(Boolean).map((t, i) =>
                `<span class="chip${i === 0 ? ' chip-gold' : ''}"${i === 0 ? ` style="color:${accent};border-color:color-mix(in srgb, ${accent} 40%, transparent);background:color-mix(in srgb, ${accent} 10%, transparent)"` : ''}>${clean(t)}</span>`
            ).join('');

            const lead = article.extracto || article.lead;
            if (lead) {
                const leadEl = document.getElementById('article-lead');
                leadEl.textContent = decodeHTMLEntities(clean(lead));
                leadEl.hidden = false;
                document.querySelector('meta[name="description"]').setAttribute('content', leadEl.textContent);
            }

            document.getElementById('article-author').innerHTML = `<i data-lucide="pen-line"></i> ${clean(article.autor || 'Equipo Reforma 2.1')}`;
            if (article.fecha) document.getElementById('article-date').innerHTML = `<i data-lucide="calendar"></i> ${clean(article.fecha)}`;

            let imgSrc = (article.imagen_cabecera || '').trim();
            if (imgSrc && !/^https?:\/\//.test(imgSrc) && !imgSrc.startsWith('../')) imgSrc = '../' + imgSrc;
            if (imgSrc) {
                const cover = document.getElementById('article-cover');
                const imgEl = document.getElementById('header-img');
                if (article.layout === 'hero') cover.classList.add('layout-hero');
                imgEl.addEventListener('load', () => imgEl.classList.add('loaded'));
                imgEl.addEventListener('error', () => { cover.hidden = true; });
                imgEl.src = DOMPurify.sanitize(imgSrc);
                cover.hidden = false;
            }

            // ── CUERPO ──────────────────────────────────────────────────
            const purifyConfig = {
                ALLOWED_TAGS: ['b', 'i', 'em', 'strong', 'a', 'p', 'br', 'hr', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'ul', 'ol', 'li', 'blockquote', 'span', 'div', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'img', 'figure', 'figcaption', 'code', 'pre', 'sup', 'sub'],
                ALLOWED_ATTR: ['class', 'style', 'href', 'src', 'alt', 'target', 'rel']
            };
            let rawContent = article.htmlContent || article.contenido || '';

            // Strip defensivo de frontmatter por si el backend lo envía pegado al HTML
            if (rawContent.trimStart().startsWith('---')) {
                const fmEnd = rawContent.indexOf('\n---', 3);
                if (fmEnd !== -1) rawContent = rawContent.substring(fmEnd + 4).trimStart();
            }

            contentEl.innerHTML = DOMPurify.sanitize(decodeHTMLEntities(rawContent), purifyConfig);
            normalizeLegacyStyles(contentEl);

            contentEl.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
            contentEl.querySelectorAll('img').forEach(img => { img.loading = 'lazy'; img.decoding = 'async'; });
            contentEl.querySelectorAll('table').forEach(table => {
                table.classList.add('pro-table');
                const wrapper = document.createElement('div');
                wrapper.className = 'pro-table-wrapper';
                table.parentNode.insertBefore(wrapper, table);
                wrapper.appendChild(table);
            });

            // Tiempo de lectura estimado (~220 palabras/min)
            const words = contentEl.textContent.trim().split(/\s+/).length;
            document.getElementById('article-time').innerHTML = `<i data-lucide="clock"></i> ${Math.max(1, Math.round(words / 220))} min de lectura`;

            // ── VIDEO ───────────────────────────────────────────────────
            const rawVideoUrl = (article.video_url || '').trim().replace(/^['"]|['"]$/g, '');
            const embedUrl = rawVideoUrl && embedUrlFor(rawVideoUrl);
            if (embedUrl) {
                const videoWrapper = document.createElement('div');
                videoWrapper.className = 'article-video';
                const iframe = document.createElement('iframe');
                iframe.src = embedUrl;
                iframe.title = 'Video del artículo';
                iframe.loading = 'lazy';
                iframe.allowFullscreen = true;
                iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
                videoWrapper.appendChild(iframe);
                contentEl.appendChild(videoWrapper);
            }

            // ── RECURSO DESCARGABLE ─────────────────────────────────────
            const pdfUrl = (article.pdf_url || '').trim().replace(/^['"]|['"]$/g, '');
            const pdfText = (article.pdf_text || 'Descargar PDF').trim().replace(/^['"]|['"]$/g, '');
            if (/^https?:\/\//.test(pdfUrl)) {
                const dlBlock = document.createElement('div');
                dlBlock.className = 'resource-card';
                dlBlock.innerHTML = `
                    <div class="info">
                        <span class="ico"><i data-lucide="file-text"></i></span>
                        <div><p class="k">Recurso descargable</p><p class="v">${clean(pdfText)}</p></div>
                    </div>`;
                const dlAnchor = document.createElement('a');
                dlAnchor.className = 'btn btn-gold';
                dlAnchor.href = pdfUrl;
                dlAnchor.target = '_blank';
                dlAnchor.rel = 'noopener noreferrer';
                dlAnchor.innerHTML = '<i data-lucide="download"></i> ';
                dlAnchor.append(pdfText);
                dlAnchor.addEventListener('click', () => window.trackDownload(id, pdfUrl, pdfText));
                dlBlock.appendChild(dlAnchor);
                contentEl.appendChild(dlBlock);
            }

            document.getElementById('article-end').hidden = false;
            setupShare(decodeHTMLEntities(titulo));
            renderIcons();

            // --- TELEMETRÍA DE LECTURA ---
            const sentinel = document.createElement('div');
            sentinel.style.height = '1px';
            contentEl.appendChild(sentinel);

            let timeSpent = 0;
            let lastTime = Date.now();
            let maxScrollDepth = 0;

            const updateScroll = () => {
                const h = document.documentElement.scrollHeight - window.innerHeight;
                if (h > 0) {
                    const pct = Math.round((window.scrollY / h) * 100);
                    if (pct > maxScrollDepth) maxScrollDepth = Math.min(pct, 100);
                }
            };
            window.addEventListener('scroll', updateScroll, { passive: true });

            if ('IntersectionObserver' in window) {
                const io = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) { maxScrollDepth = 100; io.disconnect(); }
                });
                io.observe(sentinel);
            }

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') {
                    timeSpent += Math.round((Date.now() - lastTime) / 1000);
                    updateScroll();
                    fetch('/api/metrics', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ articleId: id, timeSpent, scrollDepth: maxScrollDepth }),
                        keepalive: true
                    }).catch(err => console.warn('Telemetry transmit error:', err));
                    // Solo se envía el tiempo incremental si el lector vuelve y sale de nuevo
                    timeSpent = 0;
                } else if (document.visibilityState === 'visible') {
                    lastTime = Date.now();
                }
            });
        });
    </script>

    <!-- ── VISIT TRACKING + GEOLOCALIZACIÓN ─────────────────────────────── -->
    <script>
      (async function trackVisit() {
        try {
          const articleId = new URLSearchParams(window.location.search).get('id') || null;

          const ua = navigator.userAgent;
          let deviceType = 'desktop';
          if (/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
            deviceType = /iPad/i.test(ua) ? 'tablet' : 'mobile';
          }

          // Ubicación vía ipapi.co (puede fallar por AdBlock, CORS o rate-limit)
          let location = null;
          try {
            const geoRes = await fetch('https://ipapi.co/json/', { cache: 'no-store' });
            if (geoRes.ok) {
              const geo = await geoRes.json();
              location = {
                country:      geo.country_name || null,
                country_code: geo.country_code  || null,
                city:         geo.city          || null,
                region:       geo.region        || null,
                latitude:     geo.latitude       || null,
                longitude:    geo.longitude      || null,
              };
            }
          } catch (geoErr) {
            console.warn('[Visit] ipapi.co falló; esta visita se registra sin ubicación.', geoErr.message);
          }

          await fetch('/api/metrics/visit', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              article_id:  articleId,
              location,
              device_type: deviceType,
              referrer:    document.referrer || null,
            }),
            keepalive: true,
          });
        } catch (err) {
          console.warn('[Visit] Error en visit tracking:', err.message);
        }
      })();

      window.trackDownload = function(articleId, pdfUrl, pdfText) {
        fetch('/api/metrics/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ article_id: articleId, pdf_url: pdfUrl, pdf_text: pdfText }),
          keepalive: true
        }).catch(err => console.warn('[Download] Error tracking:', err));
      };

      window.trackInteraction = function(type, buttonName) {
        const articleId = new URLSearchParams(window.location.search).get('id') || null;
        fetch('/api/metrics/event', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ article_id: articleId, event_type: type, button_name: buttonName }),
          keepalive: true
        }).catch(err => console.warn(`[Interaction - ${type}] Error tracking:`, err));
      };
    </script>
</body>
</html>
