<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso administrativo · Reforma 2.1</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0D1020">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230D1020'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23E2B04F'%3E✦%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <main class="auth-wrap">
    <div class="auth-card glass-card">
      <a href="../index.html" class="nav-logo"><span class="mark">✦</span> Reforma <span>2.1</span></a>
      <h1>Panel editorial</h1>
      <p class="sub">Acceso al dashboard y al gestor de artículos</p>
      <form id="loginForm" novalidate>
        <input class="field" type="password" id="password" placeholder="Contraseña" autocomplete="current-password" aria-label="Contraseña" required autofocus>
        <p class="form-error" id="errorMsg" role="alert"></p>
        <button type="submit" class="btn btn-gold btn-block" id="submitBtn" style="margin-top:.5rem">Ingresar</button>
      </form>
      <a href="../index.html" class="subnav-back" style="margin-top:2rem">← Volver al sitio</a>
    </div>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('submitBtn');
      const reset = (msg) => { errorMsg.textContent = msg; btn.textContent = 'Ingresar'; btn.disabled = false; };

      if (!password) return reset('Escribe la contraseña.');
      btn.textContent = 'Verificando…';
      btn.disabled = true;
      errorMsg.textContent = '';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await response.json();

        if (response.ok && data.success) {
          // El token llega en una cookie httpOnly
          window.location.href = 'dashboard_admin.html';
        } else {
          reset(data.error || 'Credenciales inválidas');
        }
      } catch (err) {
        reset('Error de conexión.');
      }
    });
  </script>
</body>
</html>
