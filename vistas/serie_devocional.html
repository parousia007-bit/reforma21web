<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Serie devocional · Reforma 2.1</title>
<meta name="description" content="Series de reflexiones diarias desde una visión reformacional · Reforma 2.1">
<meta name="theme-color" content="#0D1020">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230D1020'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23E2B04F'%3E✦%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/styles.css">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <nav class="subnav" aria-label="Navegación">
    <div class="nav-inner">
      <a href="../index.html#muro" class="subnav-back"><i data-lucide="arrow-left"></i> Volver a los artículos</a>
      <a href="../index.html" class="nav-logo"><span class="mark">✦</span> Reforma <span>2.1</span></a>
    </div>
  </nav>

  <header class="page-hero" style="--hero-img:url('https://images.unsplash.com/photo-1529070538774-1843cb3265df?w=1600&q=70')">
    <div class="inner">
      <span class="chip chip-gold" id="serie-kicker">Serie devocional</span>
      <h1 id="serie-title">Cargando serie…</h1>
      <p id="serie-desc">Reflexiones breves del Modelo Educativo Trascendental para leer en familia, una a la vez.</p>
      <div class="series-progress" id="serie-progress" hidden>
        <div class="track"><span id="progress-bar" style="width:0"></span></div>
        <span id="progress-label"></span>
      </div>
    </div>
  </header>

  <main class="lessons" id="lista-render" aria-live="polite"></main>

  <script src="../js/db/devocionales.js"></script>
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    (function () {
      const groups = Reforma.groupSeries(dbDevocionales);
      const requested = new URLSearchParams(window.location.search).get('serie');
      const name = groups[requested] ? requested : Object.keys(groups)[0];
      const list = groups[name] || [];
      const container = document.getElementById('lista-render');

      if (!list.length) {
        container.innerHTML = '<div class="article-error"><h2>Serie no encontrada</h2><p>Revisa el enlace o vuelve al inicio.</p><a class="btn btn-gold" href="../index.html#muro">Ir al inicio</a></div>';
        document.getElementById('serie-title').textContent = 'Serie no encontrada';
        return;
      }

      document.title = `${name} · Reforma 2.1`;
      // Resalta la última palabra del título en dorado, como en el resto del sitio
      const words = name.split(' ');
      const last = words.pop();
      const titleEl = document.getElementById('serie-title');
      titleEl.textContent = words.join(' ') + ' ';
      const em = document.createElement('em');
      em.textContent = last;
      titleEl.appendChild(em);
      document.getElementById('serie-kicker').textContent = `${list[0].esfera || 'Devocional'} · ${list.length} reflexiones`;

      const doneCount = list.filter(item => Reforma.store.isDone(item.id)).length;
      const nextItem = list.find(item => !Reforma.store.isDone(item.id));

      list.forEach((d, i) => {
        const done = Reforma.store.isDone(d.id);
        const isNext = d === nextItem;
        const [reference] = String(d.autor || '').split('—').map(s => s.trim());
        const a = document.createElement('a');
        a.href = 'detalle_devocional.html?id=' + encodeURIComponent(d.id);
        a.className = 'lesson reveal' + (done ? ' is-done' : '') + (isNext ? ' is-next' : '');
        a.innerHTML = `
          <span class="lesson-n">${String(i + 1).padStart(2, '0')}</span>
          <div class="lesson-body">
            ${isNext ? `<span class="badge-next"><i data-lucide="sparkles"></i> ${doneCount ? 'Continúa aquí' : 'Empieza aquí'}</span>` : ''}
            <h3></h3>
            <p class="quote"></p>
            <div class="lesson-meta">
              <span><i data-lucide="book-open"></i><span class="ref"></span></span>
              ${d.tiempo ? `<span><i data-lucide="clock"></i>${d.tiempo}</span>` : ''}
            </div>
          </div>
          <span class="lesson-state"><i data-lucide="${done ? 'check' : 'arrow-right'}"></i></span>`;
        a.querySelector('h3').textContent = d.titulo;
        a.querySelector('.quote').textContent = d.lead || '';
        a.querySelector('.ref').textContent = reference || '';
        container.appendChild(a);
      });

      const progress = document.getElementById('serie-progress');
      progress.hidden = false;
      document.getElementById('progress-label').textContent = doneCount === list.length
        ? '¡Serie completada!'
        : `${doneCount} de ${list.length} completadas`;
      requestAnimationFrame(() => {
        document.getElementById('progress-bar').style.width = (doneCount / list.length * 100) + '%';
      });

      // Aparición escalonada
      container.querySelectorAll('.reveal').forEach((el, i) => {
        el.style.transitionDelay = (i * 0.08) + 's';
        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
      });
      Reforma.icons();
    })();
  </script>
</body>
</html>
